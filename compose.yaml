name: luxe-woman
services:
  database:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_USER: luxe
      POSTGRES_DB: luxe_woman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U luxe -d luxe_woman]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://luxe:${POSTGRES_PASSWORD}@database:5432/luxe_woman?schema=public
    command: [npm, run, db:migrate]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://luxe:${POSTGRES_PASSWORD}@database:5432/luxe_woman?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
      API_PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      PRIVATE_STORAGE_PATH: /app/storage
    ports:
      - 127.0.0.1:4000:4000
    volumes:
      - private-storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  private-storage:
